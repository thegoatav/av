    :root{--accent-rgb:53,215,255}body[data-theme="violet"]{--blue:#b28aff;--blue2:#7957e8;--glow:0 0 24px #a477ff30;--accent-rgb:178,138,255}body[data-theme="mint"]{--blue:#64f2bb;--blue2:#13bd8b;--glow:0 0 24px #64f2bb30;--accent-rgb:100,242,187}body[data-theme="amber"]{--blue:#ffc45e;--blue2:#ef8b2b;--glow:0 0 24px #ffc45e30;--accent-rgb:255,196,94}body[data-theme="rose"]{--blue:#ff75aa;--blue2:#df4c87;--glow:0 0 24px #ff75aa30;--accent-rgb:255,117,170}

<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="topbar"><a class="brand" href="#" aria-label="av home">av<i>.</i></a><div class="topbar-right"><div class="top-widgets"><div id="clock-widget" class="top-widget"><span class="top-widget-label">local time</span><span id="local-clock" class="top-widget-value">--:--</span></div><div id="battery-widget" class="top-widget"><span class="top-widget-label">battery</span><span id="battery-level" class="top-widget-value">checking</span></div><button id="weather-widget" class="top-widget weather-widget" type="button" title="Uses your approximate location with Open-Meteo to show nearby temperature"><span class="top-widget-label">temperature</span><span id="weather-reading" class="top-widget-value">use my area</span></button></div><div class="status"><span class="pulse"></span><span id="status-text">connecting to lumin</span></div><button id="settings-toggle" class="settings-toggle" type="button" aria-label="open settings" title="settings">⚙</button></div></header>
    <main>
      <section class="hero"><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg><input id="search" class="search" type="search" placeholder="search games..." autocomplete="off" aria-label="Search games"></label></section>
      <section><div class="section-head"><div class="section-title"><span class="tiny"></span><span id="section-label">all games</span></div><span id="result-count" class="count">loading</span></div><div id="games" class="grid"><div class="loading">getting the games ready</div></div><div id="more-wrap" class="load-sentinel" aria-hidden="true"></div></section>
    </main>
  </div>
  <div id="player" class="player" role="dialog" aria-modal="true" aria-label="Game player"><div id="player-window" class="player-window"><div class="player-head"><span id="player-title" class="player-title">game</span><div class="player-actions"><button id="player-fullscreen" aria-label="fullscreen" title="fullscreen">⛶</button><button id="player-close" aria-label="close game" title="close game">×</button></div></div><div id="player-content" class="player-content"></div></div></div>
  <nav id="dock" class="dock" aria-label="Open games"><span class="dock-label">open</span><span id="dock-empty" class="dock-empty">your games will show up here</span></nav>
  <section id="settings-panel" class="settings-panel" role="dialog" aria-label="settings" aria-hidden="true"><div class="settings-head"><div><div class="settings-title">settings</div><div class="settings-subtitle">make av. yours</div></div><button id="settings-close" class="settings-close" type="button" aria-label="close settings">×</button></div><label class="setting-row"><span><b>theme</b><small>accent and particle color</small></span><select id="theme-select"><option value="cyan">cyan glow</option><option value="violet">violet glow</option><option value="mint">mint glow</option><option value="amber">amber glow</option><option value="rose">rose glow</option></select></label><div class="setting-divider"></div><div class="settings-section-label">top bar</div><label class="setting-toggle"><span>local time</span><input id="show-clock" type="checkbox" checked><i></i></label><label class="setting-toggle"><span>battery</span><input id="show-battery" type="checkbox" checked><i></i></label><label class="setting-toggle"><span>temperature</span><input id="show-weather" type="checkbox" checked><i></i></label><div class="setting-divider"></div><div class="setting-toggle"><span>floating particles</span><input id="particles-toggle" type="checkbox" checked><i></i></div><label class="range-setting"><span>amount <output id="density-value">42</output></span><input id="particle-density" type="range" min="8" max="96" value="42"></label><label class="range-setting"><span>speed <output id="speed-value">40</output></span><input id="particle-speed" type="range" min="0" max="100" value="40"></label></section>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const $=s=>document.querySelector(s), gamesEl=$('#games'), dock=$('#dock'), state={games:[],opened:[],active:null,query:'',page:1,pages:1,total:0,loading:false,debounce:null,request:0};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function titleOf(g){return g.name||g.title||'untitled game'}
    function idOf(g){return g.id||g.slug||g.game_id}
    function fallbackIcon(title){return esc((title||'a').trim().slice(0,1).toLowerCase())}
    function showToast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
    const clockFormatter=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'});function updateClock(){$('#local-clock').textContent=clockFormatter.format(new Date())}updateClock();setInterval(updateClock,1000);
    (async()=>{const out=$('#battery-level');if(!navigator.getBattery){out.textContent='unavailable';out.title='This browser does not expose battery percentage';return}try{const battery=await navigator.getBattery();const update=()=>{out.textContent=`${Math.round(battery.level*100)}%`;out.title=battery.charging?'charging':'battery level'};update();battery.addEventListener('levelchange',update);battery.addEventListener('chargingchange',update)}catch{out.textContent='unavailable'}})();
    let weatherPoint=null;async function fetchNearbyTemperature(){if(!weatherPoint)return;const out=$('#weather-reading');out.textContent='loading...';try{const {latitude,longitude}=weatherPoint;const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m&temperature_unit=fahrenheit&timezone=auto`;const response=await fetch(url);if(!response.ok)throw new Error('weather request failed');const data=await response.json();const temp=data.current?.temperature_2m;if(typeof temp!=='number')throw new Error('temperature unavailable');out.textContent=`${Math.round(temp)}°F`;out.title='Approximate local temperature; click to refresh'}catch{out.textContent='offline';out.title='Weather service unavailable; click to retry'}}
    $('#weather-widget').addEventListener('click',()=>{const out=$('#weather-reading');if(weatherPoint){fetchNearbyTemperature();return}if(!navigator.geolocation){out.textContent='unavailable';showToast('location is unavailable in this browser');return}out.textContent='finding area...';navigator.geolocation.getCurrentPosition(pos=>{weatherPoint={latitude:Math.round(pos.coords.latitude*10)/10,longitude:Math.round(pos.coords.longitude*10)/10};fetchNearbyTemperature()},err=>{out.textContent=err.code===1?'location off':'unavailable';showToast(err.code===1?'allow location to show nearby temperature':'couldn’t get your area')},{enableHighAccuracy:false,maximumAge:900000,timeout:12000})});setInterval(fetchNearbyTemperature,900000);
    const defaultSettings={theme:'cyan',clock:true,battery:true,weather:true,particles:true,density:42,speed:40};let settings={...defaultSettings};try{settings={...defaultSettings,...JSON.parse(localStorage.getItem('av-settings')||'{}')}}catch{}
    const settingsPanel=$('#settings-panel'),settingsToggle=$('#settings-toggle'),particleCanvas=$('#particles'),particleCtx=particleCanvas.getContext('2d');let particleList=[],particleFrame=0,particleDpr=1;
    function saveSettings(){try{localStorage.setItem('av-settings',JSON.stringify(settings))}catch{}}
    function resizeParticleCanvas(){particleDpr=Math.min(window.devicePixelRatio||1,2);particleCanvas.width=Math.round(innerWidth*particleDpr);particleCanvas.height=Math.round(innerHeight*particleDpr);particleCtx.setTransform(particleDpr,0,0,particleDpr,0,0);while(particleList.length<settings.density)particleList.push(newParticle());if(particleList.length>settings.density)particleList.length=settings.density}
    function newParticle(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.7+Math.random()*1.8,drift:(Math.random()-.5)*.3,phase:Math.random()*6.28,alpha:.2+Math.random()*.45}}
    function animateParticles(){if(!settings.particles){if(particleFrame)cancelAnimationFrame(particleFrame);particleFrame=0;particleCtx.clearRect(0,0,innerWidth,innerHeight);return}particleFrame=requestAnimationFrame(animateParticles);particleCtx.clearRect(0,0,innerWidth,innerHeight);const color=getComputedStyle(document.body).getPropertyValue('--accent-rgb').trim()||'53,215,255',speed=settings.speed/100;for(const p of particleList){p.phase+=.012+speed*.018;p.y-=speed*(.18+p.r*.22);p.x+=p.drift+Math.sin(p.phase)*.12;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}if(p.x<-5)p.x=innerWidth+5;if(p.x>innerWidth+5)p.x=-5;particleCtx.beginPath();particleCtx.arc(p.x,p.y,p.r,0,Math.PI*2);particleCtx.fillStyle=`rgba(${color},${p.alpha})`;particleCtx.shadowBlur=8;particleCtx.shadowColor=`rgba(${color},.48)`;particleCtx.fill()}particleCtx.shadowBlur=0}
    function applySettings(){document.body.dataset.theme=settings.theme;$('#clock-widget').classList.toggle('hidden-widget',!settings.clock);$('#battery-widget').classList.toggle('hidden-widget',!settings.battery);$('#weather-widget').classList.toggle('hidden-widget',!settings.weather);$('#theme-select').value=settings.theme;$('#show-clock').checked=settings.clock;$('#show-battery').checked=settings.battery;$('#show-weather').checked=settings.weather;$('#particles-toggle').checked=settings.particles;$('#particle-density').value=settings.density;$('#particle-speed').value=settings.speed;$('#density-value').value=settings.density;$('#speed-value').value=settings.speed;resizeParticleCanvas();if(!particleFrame)animateParticles()}
    function closeSettings(){settingsPanel.classList.remove('open');settingsPanel.setAttribute('aria-hidden','true');settingsToggle.setAttribute('aria-expanded','false')}
    settingsToggle.addEventListener('click',()=>{const isOpen=settingsPanel.classList.toggle('open');settingsPanel.setAttribute('aria-hidden',String(!isOpen));settingsToggle.setAttribute('aria-expanded',String(isOpen))});$('#settings-close').addEventListener('click',closeSettings);document.addEventListener('click',e=>{if(settingsPanel.classList.contains('open')&&!settingsPanel.contains(e.target)&&!settingsToggle.contains(e.target))closeSettings()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});
    $('#theme-select').addEventListener('change',e=>{settings.theme=e.target.value;applySettings();saveSettings()});$('#show-clock').addEventListener('change',e=>{settings.clock=e.target.checked;applySettings();saveSettings()});$('#show-battery').addEventListener('change',e=>{settings.battery=e.target.checked;applySettings();saveSettings()});$('#show-weather').addEventListener('change',e=>{settings.weather=e.target.checked;applySettings();saveSettings()});$('#particles-toggle').addEventListener('change',e=>{settings.particles=e.target.checked;saveSettings();if(settings.particles&&!particleFrame)animateParticles()});$('#particle-density').addEventListener('input',e=>{settings.density=Number(e.target.value);$('#density-value').value=settings.density;resizeParticleCanvas();saveSettings()});$('#particle-speed').addEventListener('input',e=>{settings.speed=Number(e.target.value);$('#speed-value').value=settings.speed;saveSettings()});window.addEventListener('resize',resizeParticleCanvas);applySettings();
    function renderCards(){
      if(state.loading&&state.games.length===0){gamesEl.innerHTML='<div class="loading">getting the games ready</div>';return}
      if(!state.games.length){gamesEl.innerHTML=`<div class="empty">${state.query?'nothing found — try another search':'no games came through. check your connection and try again.'}</div>`;$('#result-count').textContent='0 games';return}
      gamesEl.innerHTML=state.games.map((g,i)=>{const id=idOf(g),name=titleOf(g),category=(g.category||g.genre||g.provider||'browser game');return `<article class="card" tabindex="0" role="button" data-id="${esc(id)}" aria-label="play ${esc(name)}"><div class="cover"><div class="cover-fallback"><span>${fallbackIcon(name)}</span></div><span class="play-mark"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5 10 6l-7 4.5z"/></svg></span></div><div class="card-info"><div class="game-name">${esc(name)}</div><div class="game-meta">${esc(category)}</div></div></article>`}).join('');
      const total=state.total??state.games.length;$('#result-count').textContent=`${total.toLocaleString()} ${total===1?'game':'games'}`;$('#more-wrap').style.display=state.page<state.pages?'block':'none';gamesEl.querySelectorAll('.card').forEach(async card=>{const g=state.games.find(x=>String(idOf(x))===card.dataset.id);if(!g?.image_token||card.dataset.imageReady)return;card.dataset.imageReady='1';try{const src=await Lumin.getImageUrl(g.image_token);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=src;img.onerror=()=>img.remove();card.querySelector('.cover').prepend(img)}catch{}});
    }
    async function fetchGames(q='',append=false,page=1){if(!window.Lumin||(append&&state.loading))return false;const req=++state.request;state.loading=true;state.query=q;if(!append){state.games=[];state.page=1;renderCards();}try{const result=await Lumin.getGames({page,limit:25,q});if(req!==state.request)return false;const list=result.games||[];state.games=append?[...state.games,...list]:list;state.page=page;state.total=result.total;state.pages=result.pages||1;state.loading=false;renderCards();if(append)requestAnimationFrame(scheduleMoreCheck);return true}catch(e){if(req!==state.request)return false;state.loading=false;if(!append){gamesEl.innerHTML='<div class="error">couldn’t load the games. give it another try in a sec.</div>';$('#result-count').textContent='offline'}$('#status-text').textContent='connection hiccup';console.error(e);return false}}
    function renderDock(){const empty=$('#dock-empty');dock.querySelectorAll('.dock-item').forEach(n=>n.remove());empty.style.display=state.opened.length?'none':'inline';state.opened.forEach(item=>{const b=document.createElement('button');b.className='dock-item'+(item.id===state.active?' active':'');b.title=item.name;b.innerHTML=`<span class="dock-dot"></span><span class="dock-name">${esc(item.name)}</span><span class="dock-close" role="button" aria-label="close ${esc(item.name)}" data-close="${esc(item.id)}">×</span>`;b.addEventListener('click',e=>{if(e.target.closest('[data-close]')){e.stopPropagation();closeOpened(item.id);return}activate(item.id)});dock.insertBefore(b,$('#dock-empty'))})}
    async function launchGame(id){const item=state.opened.find(x=>x.id===id);if(!item)return;state.active=id;const launch=state.launch=(state.launch||0)+1;renderDock();$('#player').classList.add('open');$('#player-title').textContent=item.name;$('#player-content').innerHTML='<div class="player-loading">opening game...</div>';try{const result=await Lumin.getGameUrl(id);const url=typeof result==='string'?result:result.url;if(launch!==state.launch||state.active!==id)return;if(!url)throw new Error('LuminSDK did not return a game URL');const frame=document.createElement('iframe');frame.className='game-frame';frame.src=url;frame.title=item.name;frame.allow='autoplay; fullscreen; pointer-lock; gamepad; accelerometer; gyroscope';frame.allowFullscreen=true;$('#player-content').replaceChildren(frame)}catch(e){if(launch===state.launch){$('#player-content').innerHTML='<div class="player-loading">couldn’t start this game — try another</div>';showToast('couldn’t start this game — try another')}console.error('LuminSDK launch error:',e)}}
    async function openGame(game){const id=idOf(game);if(!id){showToast('this game is missing its id');return}if(!state.opened.some(x=>x.id===id))state.opened.push({id,name:titleOf(game),game});await launchGame(id)}
    function activate(id){launchGame(id)}
    function closeOpened(id){state.opened=state.opened.filter(x=>x.id!==id);if(state.active===id){state.active=null;state.launch=(state.launch||0)+1;if(document.fullscreenElement===$('#player-window'))document.exitFullscreen().catch(()=>{});$('#player').classList.remove('open');$('#player-content').replaceChildren()}renderDock()}
    const moreSentinel=$('#more-wrap');let scrollCheckPending=false,nextPageRetryAt=0;async function loadNextPage(){if(state.loading||state.page>=state.pages||Date.now()<nextPageRetryAt)return;const nextPage=state.page+1;moreSentinel.classList.add('loading');const loaded=await fetchGames(state.query,true,nextPage);moreSentinel.classList.remove('loading');if(!loaded)nextPageRetryAt=Date.now()+2500;else nextPageRetryAt=0}
    function checkMoreGames(){scrollCheckPending=false;if(state.page>=state.pages||state.loading)return;if(moreSentinel.getBoundingClientRect().top<=innerHeight+700)loadNextPage()}
    function scheduleMoreCheck(){if(scrollCheckPending)return;scrollCheckPending=true;requestAnimationFrame(checkMoreGames)}
    window.addEventListener('scroll',scheduleMoreCheck,{passive:true});window.addEventListener('resize',scheduleMoreCheck);if('IntersectionObserver'in window){const moreObserver=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting))scheduleMoreCheck()},{rootMargin:'700px 0px'});moreObserver.observe(moreSentinel)}
    $('#player-close').addEventListener('click',()=>{if(state.active)closeOpened(state.active)});
    $('#player-fullscreen').addEventListener('click',async()=>{const win=$('#player-window');try{if(document.fullscreenElement===win){await document.exitFullscreen()}else{await win.requestFullscreen()}}catch(e){showToast('fullscreen isn’t available here')}});
    document.addEventListener('fullscreenchange',()=>{const btn=$('#player-fullscreen'),isFull=document.fullscreenElement===$('#player-window');btn.textContent=isFull?'↙':'⛶';btn.setAttribute('aria-label',isFull?'resize game':'fullscreen');btn.title=isFull?'resize':'fullscreen'});
    gamesEl.addEventListener('click',e=>{const card=e.target.closest('.card');if(card){const game=state.games.find(g=>String(idOf(g))===card.dataset.id);if(game)openGame(game)}});gamesEl.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();e.target.click()}});
    $('#search').addEventListener('input',e=>{const q=e.target.value.trim();$('#section-label').textContent=q?`search: ${q}`:'all games';clearTimeout(state.debounce);state.debounce=setTimeout(()=>fetchGames(q),260)});
    (async()=>{try{await Lumin.init({headless:true});$('#status-text').textContent='lumin connected';await fetchGames()}catch(e){$('#status-text').textContent='connection hiccup';gamesEl.innerHTML='<div class="error">couldn’t reach the game library. refresh and try again.</div>';$('#result-count').textContent='offline';console.error(e)}})();
  </script>
</body>
</html>
